<!DOCTYPE html>
<html>
    <head>
        <title>List Tag</title>
    </head>
    <body><h3>Unordered HTML List</h3>
    <ul>
        <li>coffee</li>
        <li>tea</li>
        <li>milk</li>
    </ul>
    <h3>Ordered HTML List</h3>
    <ol>
        <li>coffee</li>
        <li>tea</li>
        <li>milk</li>
    </ol>
    <h3>description list</h3>
    <dl>
        <dt>Coffee</dt>\
        <dd>-black hot drink</dd>
        <dt>Tea</dt>
        <dd>-brown hot drink</dd>
        <dt>Milk</dt>
        <dd>-white cold drink</dd>
    </dl>
    </body>
</html>
